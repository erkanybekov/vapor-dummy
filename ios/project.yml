# Generate the Xcode project with: xcodegen generate
name: VaporCalls
options:
  bundleIdPrefix: com.erlankanybekov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    DEVELOPMENT_TEAM: NXD3KKB2C9 # Erlan Kanybekov (Personal Team)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "155.0.0"
  Pulse:
    url: https://github.com/kean/Pulse
    from: "5.2.3"

targets:
  VaporCalls:
    type: application
    platform: iOS
    sources:
      - VaporCalls
    dependencies:
      - package: WebRTC
      - package: Pulse
        product: Pulse
      - package: Pulse
        product: PulseUI
    info:
      path: VaporCalls/Info.plist
      properties:
        CFBundleDisplayName: Vapor Calls
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Камера нужна для видеозвонков.
        NSMicrophoneUsageDescription: Микрофон нужен для звонков.
        UIBackgroundModes:
          - audio
          - voip
        NSAppTransportSecurity:
          # http://localhost and LAN addresses for local development
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erlankanybekov.VaporCalls
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  VaporCallsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VaporCallsTests
    dependencies:
      - target: VaporCalls
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
